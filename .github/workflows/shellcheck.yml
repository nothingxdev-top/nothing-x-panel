name: Shellcheck

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: scripts
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2059 -e SC2155 -e SC2034 -e SC2015 -e SC2174 -e SC2046
