name: Playwright UI Regression Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-ui:
    name: Playwright UI Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/ui/package.json

      - name: Validate injected JS syntax
        run: bash scripts/tests/check-injected-js.sh

      - name: Install dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Run JSDOM Domains Test
        run: node tests/ui/domains.test.js

      - name: Install Playwright Browsers
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/ui
        run: npm test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/ui/playwright-report/
          retention-days: 14
